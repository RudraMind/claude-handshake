<title>Brentwood Brothers · Magic Notebook</title>
<meta name="description" content="An illustrated flip-book: Brentwood Brothers, Vol. 1 — The Magic Notebook.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,500;0,700;0,800;1,600&display=swap">
<style>
  :root{
    --cream:#FBF4E6; --ink:#2C2A4A; --sun:#F5B841; --leaf:#5FA35A;
    --plum:#3D3568; --star:#FFE08A; --rose:#E67E6B; --sky:#BFE0EA;
    --paper:#FFFDF7; --edge:#E7DCC4;
    --bg:#F1E7D2; --bg2:#E7DAC0; --shadow:rgba(44,42,74,.22);
    --btn:#2C2A4A; --btn-ink:#FBF4E6;
    --muted:#6B6488;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#211F38; --bg2:#191730; --paper:#241F33; --cream:#F3ECDC;
      --ink:#F3ECDC; --edge:#3A3452; --shadow:rgba(0,0,0,.5);
      --btn:#F5B841; --btn-ink:#241326; --muted:#B3AAD0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#211F38; --bg2:#191730; --paper:#241F33; --cream:#F3ECDC;
    --ink:#F3ECDC; --edge:#3A3452; --shadow:rgba(0,0,0,.5);
    --btn:#F5B841; --btn-ink:#241326; --muted:#B3AAD0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(120% 120% at 50% 0%, var(--bg) 0%, var(--bg2) 100%);
    color:var(--ink); font-family:"Nunito",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100%; padding:18px 14px 26px;
  }
  .kicker{font-family:"Fredoka",sans-serif; letter-spacing:.28em; text-transform:uppercase;
    font-size:12px; color:var(--muted); font-weight:600; margin:2px 0 12px; text-align:center}
  .stage{width:100%; max-width:660px; display:flex; flex-direction:column; align-items:center; gap:16px}
  .book{
    position:relative; width:100%; aspect-ratio:5/6.6; background:var(--paper);
    border-radius:14px 20px 20px 14px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      -8px 0 0 -2px var(--edge),
      -14px 0 0 -4px color-mix(in srgb, var(--edge) 70%, transparent),
      0 22px 44px -14px var(--shadow);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .book::before{content:""; position:absolute; top:0; bottom:0; left:0; width:26px;
    background:linear-gradient(90deg, rgba(44,42,74,.14), rgba(44,42,74,0)); pointer-events:none; z-index:3}
  .leaf{position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; transform:translateX(14px) scale(.995); pointer-events:none;
    transition:opacity .42s ease, transform .42s ease;}
  .leaf.active{opacity:1; transform:none; pointer-events:auto}
  @media (prefers-reduced-motion:reduce){.leaf{transition:none}}
  .art{width:100%; flex:0 0 auto; line-height:0}
  .art svg{width:100%; height:auto; display:block}
  .text{flex:1 1 auto; padding:16px 26px 20px; display:flex; flex-direction:column;
    justify-content:center; gap:9px; overflow:auto}
  .pageno{font-family:"Fredoka",sans-serif; font-size:12px; letter-spacing:.14em;
    color:var(--muted); text-transform:uppercase; font-weight:600}
  .line{font-size:clamp(15px,2.9vw,19px); line-height:1.5; margin:0; max-width:46ch}
  .line.big{font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(19px,4vw,26px);
    line-height:1.25; color:var(--plum)}
  .spell{font-family:"Fredoka",sans-serif; font-weight:600; color:var(--rose);
    letter-spacing:.06em; font-size:clamp(18px,3.6vw,24px)}
  .shout{font-family:"Fredoka",sans-serif; font-weight:700; color:var(--sun);
    font-size:clamp(26px,6vw,40px); letter-spacing:.04em; -webkit-text-stroke:1px var(--ink);
    text-stroke:1px var(--ink)}
  .say{font-style:italic; color:var(--plum); font-weight:600}
  .end{font-family:"Fredoka",sans-serif; font-weight:700; letter-spacing:.3em;
    color:var(--sun); font-size:clamp(22px,5vw,32px); text-align:center; margin-top:6px}

  /* Cover */
  .cover .text{display:none}
  .cover .art{flex:1 1 auto; position:relative; line-height:0}
  .cover .art svg{width:100%; height:100%; display:block}
  .mono{position:absolute; inset:0; z-index:2}
  .mono .top-kick{position:absolute; top:5%; left:0; right:0; text-align:center;
    font-family:"Fredoka",sans-serif; color:var(--star); letter-spacing:.34em;
    text-transform:uppercase; font-size:clamp(10px,2.2vw,13px); font-weight:500;
    text-shadow:0 1px 6px rgba(20,15,40,.7)}
  .lockup{position:absolute; top:30%; left:50%; transform:translateX(-50%);
    display:grid; grid-template-columns:auto auto; grid-template-rows:auto auto;
    column-gap:clamp(6px,1.6vw,12px); align-items:center;
    filter:drop-shadow(0 6px 14px rgba(20,15,40,.55))}
  .lockup .bigB{grid-row:1/3; grid-column:1; font-family:"Fredoka",sans-serif; font-weight:700;
    font-size:clamp(120px,30vw,220px); line-height:.82; color:var(--star);
    -webkit-text-stroke:clamp(2px,.7vw,4px) var(--ink); text-stroke:2px var(--ink)}
  .lockup .word{font-family:"Fredoka",sans-serif; font-weight:600; color:#fff;
    font-size:clamp(30px,8vw,58px); line-height:.9; letter-spacing:.01em;
    -webkit-text-stroke:clamp(1px,.35vw,2px) var(--ink); text-stroke:1px var(--ink)}
  .lockup .word.top{grid-row:1; grid-column:2; align-self:end}
  .lockup .word.bot{grid-row:2; grid-column:2; align-self:start}
  .vol{position:absolute; top:58%; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:9px; white-space:nowrap}
  .vol .sub{font-family:"Fredoka",sans-serif; color:var(--star); font-size:clamp(11px,2.4vw,14px);
    letter-spacing:.3em; text-transform:uppercase; font-weight:500; text-shadow:0 1px 8px rgba(20,15,40,.85)}
  .vol .band{font-family:"Fredoka",sans-serif; font-weight:600; color:var(--ink);
    background:var(--star); padding:7px 22px; border-radius:999px; font-size:clamp(16px,3.6vw,23px);
    letter-spacing:.01em; box-shadow:0 5px 16px rgba(20,15,40,.45)}

  /* Controls */
  .controls{display:flex; align-items:center; gap:14px; user-select:none}
  .nav{font-family:"Fredoka",sans-serif; font-weight:600; font-size:15px; cursor:pointer;
    border:none; background:var(--btn); color:var(--btn-ink); padding:11px 20px;
    border-radius:999px; display:inline-flex; align-items:center; gap:8px;
    box-shadow:0 6px 16px -6px var(--shadow); transition:transform .12s ease, opacity .2s}
  .nav:hover{transform:translateY(-1px)}
  .nav:active{transform:translateY(0)}
  .nav:disabled{opacity:.35; cursor:default; transform:none}
  .nav:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
  .counter{font-family:"Fredoka",sans-serif; font-weight:600; color:var(--muted);
    min-width:104px; text-align:center; font-size:14px; letter-spacing:.04em}
  .tap{position:absolute; top:0; bottom:0; width:34%; z-index:4; cursor:pointer; background:transparent; border:none}
  .tap.left{left:0} .tap.right{right:0}
  .tap:focus-visible{outline:2px solid var(--sun); outline-offset:-4px}
  .hint{font-size:12px; color:var(--muted); text-align:center; font-family:"Fredoka",sans-serif; letter-spacing:.03em}

  /* ---- Print / PDF: one leaf per page ---- */
  @media print{
    @page{ size:150mm 198mm; margin:0; }
    html,body{ background:#fff; }
    body{ display:block; padding:0; }
    .kicker,.controls,.hint,.tap{ display:none !important; }
    .stage{ max-width:none; width:auto; gap:0; }
    .book{ width:150mm; height:auto; aspect-ratio:auto; border-radius:0;
      box-shadow:none; overflow:visible; }
    .book::before{ display:none; }
    .leaf{ position:relative; inset:auto; opacity:1 !important; transform:none !important;
      pointer-events:auto; height:198mm; break-after:page; page-break-after:always;
      overflow:hidden; border-bottom:1px solid #eee; }
    .leaf:last-child{ break-after:auto; page-break-after:auto; }
    .cover .art{ height:198mm; }
    .art,.art svg{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>

<p class="kicker">A Brentwood Brothers Picture Book</p>
<div class="stage">
  <div class="book" id="book" aria-label="Story book" role="group"></div>
  <div class="controls">
    <button class="nav" id="prev" aria-label="Previous page">‹ Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav" id="next" aria-label="Next page">Next ›</button>
  </div>
  <p class="hint">Use the arrows, the ← → keys, or tap the sides of the page.</p>
</div>

<script>
/* ---------- palette ---------- */
const C = {
  cream:"#FBF4E6", ink:"#2C2A4A", sun:"#F5B841", leaf:"#5FA35A", darkleaf:"#4A8148",
  plum:"#3D3568", star:"#FFE08A", rose:"#E67E6B", sky:"#BFE0EA", nightsky:"#2A2650",
  skin:"#E8B98A", skin2:"#D9A876", hair:"#2A2320", kurtaB:"#3F72AF", kurtaBd:"#345F92",
  kurtaS:"#F1863C", kurtaSd:"#D96E29", churidar:"#F3ECD9", trunk:"#7A5A3A", grass:"#6FB05C",
  lemon:"#F4D03F", cloud:"#FBFBFF", fog:"#Dfe4ea", rock:"#9AA0A8", rockD:"#7C828B",
  house:"#E8Cda0", roof:"#B5654A", glass:"#FCE9A8"
};

/* ---------- character ---------- */
/* feet-centre at (cx,cy); builds upward. */
function boy(cx, cy, s, o){
  o = o || {};
  const kurta = o.kurta || C.kurtaB, kurtaD = o.kurtaD || C.kurtaBd;
  const face = o.face || "happy";
  const glasses = o.glasses;
  const pose = o.pose || "down";
  // hand targets (local coords, feet at 0, up = negative)
  let lH=[-27,-54], rH=[27,-54];               // down
  if(pose==="up"){ lH=[-30,-148]; rH=[30,-148]; }
  if(pose==="cheer"){ lH=[-34,-150]; rH=[34,-150]; }
  if(pose==="cross"){ lH=[14,-74]; rH=[-14,-74]; }
  if(pose==="pointUp"){ lH=[-27,-54]; rH=[26,-152]; }
  if(pose==="hold"){ lH=[-13,-96]; rH=[13,-96]; }
  if(pose==="sit"){ lH=[-24,-64]; rH=[24,-64]; }
  const legY = pose==="sit" ? -30 : 0;         // sitting: shorter legs, drawn forward
  const eyes = {
    happy:`<circle cx="-7" cy="-120" r="2.6" fill="${C.ink}"/><circle cx="7" cy="-120" r="2.6" fill="${C.ink}"/>`,
    amazed:`<circle cx="-7" cy="-121" r="3.4" fill="#fff" stroke="${C.ink}" stroke-width="1.4"/><circle cx="7" cy="-121" r="3.4" fill="#fff" stroke="${C.ink}" stroke-width="1.4"/><circle cx="-7" cy="-121" r="1.7" fill="${C.ink}"/><circle cx="7" cy="-121" r="1.7" fill="${C.ink}"/>`,
    glare:`<path d="M-12 -125 L-3 -122" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M12 -125 L3 -122" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="-7" cy="-119" r="2.4" fill="${C.ink}"/><circle cx="7" cy="-119" r="2.4" fill="${C.ink}"/>`,
    soft:`<path d="M-10 -120 q3 -3 6 0" stroke="${C.ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M4 -120 q3 -3 6 0" stroke="${C.ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
    proud:`<path d="M-11 -121 q4 -4 8 0" stroke="${C.ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M3 -121 q4 -4 8 0" stroke="${C.ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
  }[face] || "";
  const mouth = {
    happy:`<path d="M-8 -110 q8 8 16 0" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
    amazed:`<ellipse cx="0" cy="-108" rx="5.5" ry="7" fill="${C.ink}"/>`,
    glare:`<path d="M-7 -108 L7 -108" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
    soft:`<path d="M-7 -110 q7 5 14 0" stroke="${C.ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
    proud:`<path d="M-8 -110 q8 7 16 0" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
  }[face] || "";
  const gl = glasses ? `
    <circle cx="-7" cy="-120" r="7.5" fill="none" stroke="${C.ink}" stroke-width="1.8"/>
    <circle cx="7" cy="-120" r="7.5" fill="none" stroke="${C.ink}" stroke-width="1.8"/>
    <path d="M-0.5 -121 h1.6 M-14.5 -121 h-4 M14.5 -121 h4" stroke="${C.ink}" stroke-width="1.8" stroke-linecap="round"/>` : "";
  const hand = (x,y)=>`<circle cx="${x}" cy="${y}" r="6" fill="${C.skin}"/>`;
  return `<g transform="translate(${cx} ${cy}) scale(${s})">
    <!-- legs -->
    <line x1="-9" y1="-44" x2="-13" y2="${legY-2}" stroke="${C.churidar}" stroke-width="15" stroke-linecap="round"/>
    <line x1="9" y1="-44" x2="13" y2="${legY-2}" stroke="${C.churidar}" stroke-width="15" stroke-linecap="round"/>
    <ellipse cx="-13" cy="${legY}" rx="9" ry="5" fill="${C.ink}"/>
    <ellipse cx="13" cy="${legY}" rx="9" ry="5" fill="${C.ink}"/>
    <!-- arms behind body -->
    <line x1="-18" y1="-88" x2="${lH[0]}" y2="${lH[1]}" stroke="${kurta}" stroke-width="13" stroke-linecap="round"/>
    <line x1="18" y1="-88" x2="${rH[0]}" y2="${rH[1]}" stroke="${kurta}" stroke-width="13" stroke-linecap="round"/>
    ${hand(lH[0],lH[1])}${hand(rH[0],rH[1])}
    <!-- kurta body -->
    <path d="M-20 -92 Q0 -100 20 -92 L29 -44 Q0 -34 -29 -44 Z" fill="${kurta}"/>
    <path d="M-29 -44 Q0 -34 29 -44 L27 -49 Q0 -40 -27 -49 Z" fill="${kurtaD}"/>
    <path d="M0 -92 L-6 -78 M0 -92 L6 -78" stroke="${kurtaD}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- neck + head -->
    <rect x="-6" y="-104" width="12" height="14" rx="5" fill="${C.skin2}"/>
    <circle cx="0" cy="-120" r="20" fill="${C.skin}"/>
    <path d="M-20 -122 Q-20 -145 0 -145 Q20 -145 20 -122 Q14 -134 0 -134 Q-8 -134 -14 -128 Q-18 -126 -20 -122 Z" fill="${C.hair}"/>
    <circle cx="-13" cy="-114" r="3" fill="${C.rose}" opacity=".5"/>
    <circle cx="13" cy="-114" r="3" fill="${C.rose}" opacity=".5"/>
    ${eyes}${gl}${mouth}
  </g>`;
}

/* ---------- shared props ---------- */
function star(x,y,r,fill){
  let p="", n=5;
  for(let i=0;i<n*2;i++){
    const rad=i%2?r*.44:r, a=(Math.PI/n)*i - Math.PI/2;
    p += (i?"L":"M")+(x+Math.cos(a)*rad).toFixed(1)+" "+(y+Math.sin(a)*rad).toFixed(1)+" ";
  }
  return `<path d="${p}Z" fill="${fill||C.star}"/>`;
}
function twinkles(spec){ return spec.map(([x,y,r])=>star(x,y,r,C.star)).join(""); }
function lemonTree(x,y,sc){ sc=sc||1; return `<g transform="translate(${x} ${y}) scale(${sc})">
  <path d="M-8 0 Q-14 -60 -4 -120 L4 -120 Q10 -60 8 0 Z" fill="${C.trunk}"/>
  <path d="M-2 -70 Q-30 -80 -40 -108 M2 -80 Q28 -92 40 -116" stroke="${C.trunk}" stroke-width="7" fill="none" stroke-linecap="round"/>
  <ellipse cx="-8" cy="-150" rx="62" ry="52" fill="${C.darkleaf}"/>
  <ellipse cx="30" cy="-132" rx="48" ry="42" fill="${C.leaf}"/>
  <ellipse cx="-30" cy="-124" rx="40" ry="36" fill="${C.leaf}"/>
  <circle cx="-30" cy="-160" r="7" fill="${C.lemon}"/><circle cx="18" cy="-172" r="7" fill="${C.lemon}"/>
  <circle cx="42" cy="-128" r="7" fill="${C.lemon}"/><circle cx="-46" cy="-120" r="6" fill="${C.lemon}"/>
  <circle cx="-2" cy="-118" r="6" fill="${C.lemon}"/>
</g>`; }
function cloud(x,y,sc,fill){ sc=sc||1; fill=fill||C.cloud; return `<g transform="translate(${x} ${y}) scale(${sc})">
  <ellipse cx="0" cy="0" rx="46" ry="26" fill="${fill}"/>
  <ellipse cx="-34" cy="6" rx="26" ry="18" fill="${fill}"/>
  <ellipse cx="34" cy="6" rx="30" ry="20" fill="${fill}"/>
  <ellipse cx="6" cy="-14" rx="26" ry="20" fill="${fill}"/></g>`; }

const W=800,H=520;
function frame(defs, body, bg){
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>${defs||""}</defs>
  <rect width="${W}" height="${H}" fill="${bg||C.sky}"/>${body}</svg>`;
}
function grad(id, stops, x1,y1,x2,y2){
  return `<linearGradient id="${id}" x1="${x1||0}" y1="${y1||0}" x2="${x2||0}" y2="${y2||1}">
    ${stops.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join("")}</linearGradient>`;
}

/* ---------- scenes (one per page) ---------- */
const S = {};

// COVER — portrait dusk yard, house, lemon tree, both boys, glowing notebook
S.cover = ()=>{
  const CW=820, CH=1082;
  return `<svg viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Brentwood Brothers in their backyard at dusk with a glowing notebook">
  <defs>${grad("cvsky",[["0","#2E2652"],["0.5","#6E4C8C"],["0.8","#C56B7A"],["1","#E58B6B"]])}</defs>
  <rect width="${CW}" height="${CH}" fill="url(#cvsky)"/>
  ${twinkles([[90,90,7],[200,60,5],[330,110,4],[520,70,5],[610,130,4],[700,80,6],[150,180,4],[430,150,4],[760,200,5]])}
  <circle cx="660" cy="230" r="56" fill="${C.star}" opacity=".92"/>
  <circle cx="660" cy="230" r="74" fill="${C.star}" opacity=".18"/>
  <rect x="0" y="770" width="${CW}" height="312" fill="#4E6B3C"/>
  <path d="M0 770 Q220 748 440 768 T820 762 L820 800 L0 800 Z" fill="#6FB05C"/>
  <g transform="translate(150 770)">
    <rect x="-78" y="-104" width="156" height="104" fill="${C.house}"/>
    <path d="M-94 -104 L0 -164 L94 -104 Z" fill="${C.roof}"/>
    <rect x="-52" y="-78" width="38" height="38" rx="3" fill="${C.glass}"/>
    <rect x="16" y="-78" width="38" height="38" rx="3" fill="${C.glass}"/>
    <rect x="-18" y="-50" width="36" height="50" rx="4" fill="${C.roof}"/>
  </g>
  ${lemonTree(688,792,1.12)}
  ${boy(352,1024,1.32,{kurta:C.kurtaB,kurtaD:C.kurtaBd,glasses:true,face:"happy",pose:"down"})}
  ${boy(474,1030,1.12,{kurta:C.kurtaS,kurtaD:C.kurtaSd,face:"happy",pose:"pointUp"})}
  <g transform="translate(250 1000)">
    <ellipse cx="0" cy="16" rx="56" ry="13" fill="${C.star}" opacity=".45"/>
    <rect x="-32" y="-32" width="64" height="48" rx="5" fill="#C7503F"/>
    <rect x="-32" y="-32" width="11" height="48" fill="#9A3A2D"/>
    <rect x="-17" y="-24" width="43" height="31" rx="2" fill="${C.cream}"/>
    ${star(6,-8,10,C.sun)}
  </g></svg>`;
};

// P1 — both boys in front of house, matching kurtas
S.p1 = ()=>frame(
  grad("p1sky",[["0","#CDE7F0"],["1","#F3E4C4"]]),
  `<rect width="${W}" height="${H}" fill="url(#p1sky)"/>
   <circle cx="140" cy="90" r="40" fill="${C.sun}"/>
   ${cloud(560,90,1)}${cloud(300,60,.7)}
   <rect x="0" y="356" width="${W}" height="164" fill="#6FB05C"/>
   <path d="M0 356 Q400 340 800 356 L800 380 L0 380 Z" fill="#7FBE68"/>
   <g transform="translate(400 356)">
     <rect x="-150" y="-150" width="300" height="150" fill="${C.house}"/>
     <path d="M-176 -150 L0 -226 L176 -150 Z" fill="${C.roof}"/>
     <rect x="-110" y="-116" width="56" height="56" rx="4" fill="${C.glass}"/>
     <rect x="54" y="-116" width="56" height="56" rx="4" fill="${C.glass}"/>
     <rect x="-30" y="-84" width="60" height="84" rx="6" fill="${C.roof}"/>
     <circle cx="18" cy="-42" r="4" fill="${C.sun}"/>
   </g>
   ${boy(300,470,1.24,{kurta:C.kurtaB,kurtaD:C.kurtaBd,glasses:true,face:"happy"})}
   ${boy(500,474,0.98,{kurta:C.kurtaS,kurtaD:C.kurtaSd,face:"happy"})}`,
  C.sky);

// P2 — split: Sujith with books / Saaho lifting watering can
S.p2 = ()=>frame(
  grad("p2a",[["0","#CFE8DF"],["1","#EAF3D9"]]),
  `<rect width="${W}" height="${H}" fill="url(#p2a)"/>
   <rect x="400" y="0" width="1" height="${H}" fill="#0000"/>
   <path d="M400 40 L400 480" stroke="${C.edge||'#E7DCC4'}" stroke-width="3" stroke-dasharray="10 10" opacity=".5"/>
   <rect x="0" y="380" width="${W}" height="140" fill="#7FBE68"/>
   <!-- left: books -->
   <g transform="translate(120 380)">

/* ---------- render + navigation ---------- */
const book = document.getElementById("book");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
let idx = 0;

PAGES.forEach((p,i)=>{
  const leaf = document.createElement("div");
  leaf.className = "leaf" + (p.cover?" cover":"");
  if(p.cover){
    leaf.innerHTML = `<div class="art">${S.cover()}
      <div class="mono">
        <div class="top-kick">A Picture Book</div>
        <div class="lockup" aria-label="Brentwood Brothers">
          <div class="bigB" aria-hidden="true">B</div>
          <div class="word top">rentwood</div>
          <div class="word bot">rothers</div>
        </div>
        <div class="vol">
          <div class="sub">Volume One</div>
          <div class="band">The Magic Notebook</div>
        </div>
      </div></div>`;
  } else {
    const lines = p.lines.map(l=>`<p class="line ${l.c||""}">${l.t}</p>`).join("");
    leaf.innerHTML = `<div class="art">${p.art()}</div>
      <div class="text"><span class="pageno">Page ${p.n}</span>${lines}</div>`;
  }
  book.appendChild(leaf);
});
const leaves = [...book.querySelectorAll(".leaf")];

// side tap zones
const tapL = document.createElement("button"); tapL.className="tap left"; tapL.setAttribute("aria-label","Previous page");
const tapR = document.createElement("button"); tapR.className="tap right"; tapR.setAttribute("aria-label","Next page");
book.appendChild(tapL); book.appendChild(tapR);
tapL.onclick=()=>go(idx-1); tapR.onclick=()=>go(idx+1);

function go(i){
  idx = Math.max(0, Math.min(PAGES.length-1, i));
  leaves.forEach((l,k)=>l.classList.toggle("active", k===idx));
  counter.textContent = idx===0 ? "Cover" : `Page ${idx} of ${PAGES.length-1}`;
  prevBtn.disabled = idx===0;
  nextBtn.disabled = idx===PAGES.length-1;
  book.scrollTop = 0;
}
prevBtn.onclick=()=>go(idx-1);
nextBtn.onclick=()=>go(idx+1);
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") go(idx+1);
  else if(e.key==="ArrowLeft") go(idx-1);
});
go(0);
</script>
